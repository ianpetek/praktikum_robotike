# usb_cam parameters for the overhead camera. Loads the calibrated intrinsics
# (camera_info_url) so /camera_info carries the real camera matrix + distortion.
/**:
    ros__parameters:
      video_device: "/dev/video4"
      framerate: 30.0
      io_method: "mmap"
      frame_id: "camera"
      pixel_format: "mjpeg2rgb"
      av_device_format: "YUV422P"
      image_width: 640
      image_height: 480
      camera_name: "camera"
      camera_info_url: "package://pr_calibration/config/camera_calibration_params.yaml"
      brightness: -1
      contrast: -1
      saturation: -1
      sharpness: -1
      gain: -1
      auto_white_balance: true
      white_balance: 4000
      autoexposure: true
      exposure: 100
      autofocus: false
      focus: -1
